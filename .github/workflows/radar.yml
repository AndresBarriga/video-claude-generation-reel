# Radar de virales semanal → datos/radar.json + docs/radar.md, con commit. Guía: docs/radar-metodo.md
name: Radar de virales
on:
  schedule:
    - cron: '41 5 * * 1' # lunes 06:41 en Berlín
  workflow_dispatch:
    inputs:
      ids:
        description: 'Reels concretos a bajar (códigos de URL, p. ej. DfNQfA0NE1o,DfW9qUitXVN). Vacío = los 8 mejores'
        required: false
        default: ''
permissions:
  contents: write
concurrency: ig-metricas
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias (whisper)
        run: (command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)) && pip install -q faster-whisper
      - name: Radar y commit
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          RADAR_IDS: ${{ github.event.inputs.ids }}
        run: |
          git config user.name "metricas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/radar.mjs
          python3 tools/radar-media.py
          git add datos/radar.json docs/radar.md radar
          git diff --cached --quiet && exit 0
          git commit -qm "Radar de virales $(TZ=Europe/Berlin date '+%Y-%m-%d')"
          git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
